name: Offline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Compile, pytest and offline fixture
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python3 -m compileall -q writing_agent benchmark

      - name: Run unit tests
        run: python3 -m pytest -q

      - name: Run offline Audiobook Director fixture
        run: python3 benchmark/run_audiobook_director_fixture_v1.py
